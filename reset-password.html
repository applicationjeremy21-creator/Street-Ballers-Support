<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Street Ballers - Reset Password</title><style>
body{margin:0;background:#0e0e0e;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(92vw,460px);background:#191919;border:1px solid #333;border-radius:20px;padding:28px;box-sizing:border-box}.logo{font-size:52px;font-weight:900;font-style:italic;color:#f57c00;text-align:center}.brand{text-align:center;font-size:24px;font-weight:900;margin:0 0 6px}.sub{color:#aaa;text-align:center;line-height:1.45;margin:0 0 22px}input{width:100%;box-sizing:border-box;background:#0e0e0e;color:#fff;border:1px solid #444;border-radius:12px;padding:14px;margin:7px 0;font-size:16px}button{width:100%;border:0;border-radius:12px;padding:15px;margin-top:12px;background:#f57c00;color:#fff;font-size:16px;font-weight:900;cursor:pointer}#msg{margin-top:15px;line-height:1.4;text-align:center}.bad{color:#ff8a80}.good{color:#9be7a3}</style></head>
<body><main class="card"><div class="logo">SB</div><h1 class="brand">Street Ballers</h1><p class="sub">Create a new password for your account. This secure page works on phones, tablets, and computers.</p><div id="form" hidden><input id="p1" type="password" minlength="6" placeholder="New password" autocomplete="new-password"><input id="p2" type="password" minlength="6" placeholder="Confirm new password" autocomplete="new-password"><button id="save">Update Password</button></div><div id="msg">Preparing your password reset…</div><button id="openApp" type="button" hidden>Open Street Ballers App</button></main>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
const supabase=createClient("https://pygzdhecmzujbaymqrny.supabase.co","sb_publishable_jfWWRUzq8Q9IyXAZ__XUeA_pCUF9Uwc");
const msg=document.querySelector("#msg"),form=document.querySelector("#form"),openApp=document.querySelector("#openApp");if(location.hash||location.search){openApp.hidden=false;openApp.onclick=()=>{location.href="streetballers://reset-password"+location.search+location.hash}}function say(t,c=""){msg.textContent=t;msg.className=c}
async function prepare(){const h=new URLSearchParams(location.hash.slice(1)),a=h.get("access_token"),r=h.get("refresh_token"),e=h.get("error_description");if(e){say(e.replace(/\\+/g," "),"bad");return}if(a&&r){const {error}=await supabase.auth.setSession({access_token:a,refresh_token:r});if(error){say(error.message,"bad");return}history.replaceState({},document.title,location.pathname)}const {data}=await supabase.auth.getSession();if(!data.session){say("This password-reset link is no longer active. Request a new reset email from Street Ballers.","bad");return}form.hidden=false;say("")}
document.querySelector("#save").onclick=async()=>{const p1=document.querySelector("#p1").value,p2=document.querySelector("#p2").value;if(p1.length<6){say("Password must be at least 6 characters.","bad");return}if(p1!==p2){say("The passwords do not match.","bad");return}const b=document.querySelector("#save");b.disabled=true;b.textContent="Updating…";const {error}=await supabase.auth.updateUser({password:p1});if(error){say(error.message,"bad");b.disabled=false;b.textContent="Update Password";return}await supabase.auth.signOut();form.hidden=true;say("Password updated successfully. You can now sign in to Street Ballers with your new password.","good")};prepare();
</script></body></html>
